<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Documentación - OTEC</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #1a202c; margin-bottom: 10px; font-size: 24px; }
        p { color: #4a5568; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #4a5568; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 16px; transition: border-color 0.2s; }
        input:focus { border-color: #1a73e8; outline: none; }
        button { background-color: #1a73e8; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #90b4ec; cursor: wait; }
        .btn-drive { display: none; margin-top: 25px; background-color: #34a853; color: white; padding: 14px; text-decoration: none; border-radius: 6px; font-weight: bold; width: 100%; font-size: 16px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-drive:hover { background-color: #2d8e47; }
        #error-msg { color: #e53e3e; margin-top: 15px; font-weight: 500; font-size: 14px; display: none; background: #fff5f5; padding: 10px; border-radius: 6px; border: 1px solid #fed7d7; }
        #success-msg { color: #2b6cb0; margin-top: 15px; font-weight: 500; font-size: 14px; display: none; background: #ebf8ff; padding: 10px; border-radius: 6px; border: 1px solid #bee3f8; }
        #step2 { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed #e2e8f0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Portal de Acreditación</h2>
    <p>Para acceder de forma segura a tus carpetas resguardadas ante la SPD, ingresa tu RUT para recibir un código único en tu correo electrónico registrado.</p>

    <!-- PASO 1: Ingreso de RUT -->
    <div id="step1">
        <div class="input-group">
            <label for="rutInput">RUT del Alumno</label>
            <input type="text" id="rutInput" placeholder="Ej: 12.345.678-9" oninput="formatearRUT(this)">
        </div>
        <button id="btnSolicitar" onclick="solicitarCodigo()">Solicitar Código de Acceso</button>
    </div>

    <!-- PASO 2: Ingreso de Código Temporal -->
    <div id="step2">
        <div class="input-group">
            <label for="codeInput">Código de 6 dígitos enviado a tu correo</label>
            <input type="text" id="codeInput" placeholder="Ej: 123456" maxlength="6" inputmode="numeric" style="text-align: center; letter-spacing: 5px; font-size: 20px;">
        </div>
        <button id="btnVerificar" onclick="verificarCodigo()">Verificar Código e Ingresar</button>
    </div>

    <div id="error-msg"></div>
    <div id="success-msg"></div>

    <a id="driveLink" href="#" target="_blank" rel="noopener" class="btn-drive">📁 Abrir mi carpeta segura</a>
</div>

<script>
    // URL de la Web App (debe terminar en /exec y estar en script.google.com)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzn7E8th_KZpRosWlRqva-1H9XStiQth8dFs2XOn0QfO25KqBNbQNBrVgeHb-8Nh_RTmA/exec";

    function formatearRUT(input) {
        let valor = input.value.replace(/[^0-9kK]/g, '');
        if (valor.length < 2) return;
        let cuerpo = valor.slice(0, -1);
        let dv = valor.slice(-1).toUpperCase();
        input.value = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + dv;
    }

    // IMPORTANTE: no agregar "headers" al fetch. Con Content-Type: application/json el navegador
    // hace una petición previa (preflight OPTIONS) que Apps Script no sabe responder.
    // Sin headers, el body string se envía como text/plain y el navegador no hace preflight.
    async function llamarBackend(payload) {
        let host = "";
        try { host = new URL(WEB_APP_URL).hostname; } catch (e) {}
        if (host !== "script.google.com") {
            throw new Error("WEB_APP_URL mal configurada: " + WEB_APP_URL);
        }

        const res = await fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        });
        const texto = await res.text();
        try {
            return JSON.parse(texto);
        } catch (e) {
            console.error("Respuesta no JSON (status " + res.status + "):", texto.slice(0, 300));
            throw new Error("El servidor no devolvió JSON. Revisa la implementación del Apps Script.");
        }
    }

    async function solicitarCodigo() {
        const rut = document.getElementById("rutInput").value;
        const successDiv = document.getElementById("success-msg");
        const btn = document.getElementById("btnSolicitar");

        ocultarMensajes();

        if (!rut || rut.length < 5) {
            mostrarError("Por favor, ingresa un RUT válido.");
            return;
        }

        btn.innerText = "Enviando...";
        btn.disabled = true;

        try {
            const data = await llamarBackend({ action: "SOLICITAR_CODIGO", rut: rut });
            if (data.success) {
                successDiv.innerText = "Código enviado con éxito al correo registrado: " + data.correo;
                successDiv.style.display = "block";
                document.getElementById("step2").style.display = "block";
                document.getElementById("rutInput").disabled = true;
            } else {
                mostrarError(data.error);
            }
        } catch (err) {
            mostrarError("Error al conectar con la base de datos.");
            console.error(err);
        } finally {
            btn.innerText = "Solicitar Código de Acceso";
            btn.disabled = false;
        }
    }

    async function verificarCodigo() {
        const rut = document.getElementById("rutInput").value;
        const code = document.getElementById("codeInput").value.trim();
        const driveLink = document.getElementById("driveLink");
        const btn = document.getElementById("btnVerificar");

        document.getElementById("error-msg").style.display = "none";

        if (!/^\d{6}$/.test(code)) {
            mostrarError("Ingresa el código completo de 6 dígitos.");
            return;
        }

        btn.innerText = "Verificando...";
        btn.disabled = true;

        try {
            const data = await llamarBackend({ action: "VERIFICAR_CODIGO", rut: rut, codigo: code });
            if (data.success) {
                document.getElementById("success-msg").style.display = "none";
                document.getElementById("step1").style.display = "none";
                document.getElementById("step2").style.display = "none";
                driveLink.href = data.url;
                driveLink.style.display = "block";
            } else {
                mostrarError(data.error);
            }
        } catch (err) {
            mostrarError("Error al procesar el código.");
            console.error(err);
        } finally {
            btn.innerText = "Verificar Código e Ingresar";
            btn.disabled = false;
        }
    }

    function ocultarMensajes() {
        document.getElementById("error-msg").style.display = "none";
        document.getElementById("success-msg").style.display = "none";
    }

    function mostrarError(txt) {
        const errorDiv = document.getElementById("error-msg");
        errorDiv.innerText = txt;
        errorDiv.style.display = "block";
    }
</script>
</body>
</html>
